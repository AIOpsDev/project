<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aac.bd - Vision POS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Styling Engine (Tailwind CSS & DaisyUI) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

    <!-- UI Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- TensorFlow.js & COCO-SSD Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

    <!-- Dynamsoft Barcode Reader CDN -->
    <script src="https://cdn.jsdelivr.net/npm/dynamsoft-javascript-barcode@9.6.20/dist/dbr.js"></script>

    <!-- Tesseract.js OCR CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { font-family: 'Roboto', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-[100dvh] antialiased selection:bg-blue-100 selection:text-blue-700">

    <!-- MAIN APPLICATION CONTAINER -->
    <main id="app" class="max-w-md mx-auto min-h-[100dvh] flex flex-col justify-between p-4 space-y-4">
        
        <!-- HEADER SECTION -->
        <header class="flex items-center justify-between border-b border-gray-200 pb-3">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">A</div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-gray-900 leading-none">aac.bd</h1>
                    <span class="text-xs text-gray-500">AI Self Checkout</span>
                </div>
            </div>
            <div class="badge badge-outline text-gray-600 text-xs gap-1 border-gray-300">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                Ready
            </div>
        </header>

        <!-- VIEWPORT CONTAINER -->
        <section id="viewport-container" class="relative w-full aspect-square bg-gray-100 border-2 border-dashed border-gray-300 rounded-2xl overflow-hidden flex items-center justify-center shadow-inner">
            <video id="webcam" class="hidden absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>
            <img id="img-preview" class="hidden absolute inset-0 w-full h-full object-contain bg-black/5" alt="Uploaded Viewport" />
            <canvas id="detection-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
            
            <div id="viewport-placeholder" class="flex flex-col items-center justify-center p-6 text-center text-gray-400 space-y-2">
                <i data-lucide="camera" class="w-12 h-12 stroke-[1.5]"></i>
                <p class="text-sm font-medium text-gray-500">Upload an item image or start live camera</p>
            </div>
        </section>

        <!-- CONTROLS BAR -->
        <section class="grid grid-cols-2 gap-3">
            <input type="file" id="file-input" accept="image/*" class="hidden" />
            <button id="btn-upload" class="btn bg-white hover:bg-gray-100 text-gray-700 border-gray-300 font-medium shadow-sm gap-2">
                <i data-lucide="upload" class="w-4 h-4"></i> Upload Image
            </button>
            <button id="btn-camera" class="btn bg-blue-600 hover:bg-blue-700 text-white font-medium border-none shadow-sm gap-2">
                <i data-lucide="video" class="w-4 h-4"></i> Live Camera
            </button>
        </section>

        <!-- LOG TERMINAL -->
        <section class="bg-gray-900 text-gray-200 rounded-xl p-3 shadow-md mono-font text-xs space-y-1">
            <div class="flex items-center justify-between text-gray-400 border-b border-gray-800 pb-1 mb-2">
                <span class="flex items-center gap-1 font-semibold text-[10px] tracking-wider uppercase">
                    <i data-lucide="terminal" class="w-3 h-3 text-blue-400"></i> Terminal Log
                </span>
                <span id="status-indicator" class="text-[10px] text-yellow-400">Initializing Engines...</span>
            </div>
            <div id="terminal-logs" class="h-20 overflow-y-auto space-y-1 scrollbar-thin scrollbar-thumb-gray-700 pr-1">
                <div class="text-gray-500">> System initializing. Waiting for engines...</div>
            </div>
        </section>

        <!-- CART SECTION -->
        <section class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm space-y-3 flex-1 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between border-b border-gray-100 pb-2 mb-2">
                    <h2 class="font-bold text-gray-800 text-sm flex items-center gap-2">
                        <i data-lucide="shopping-cart" class="w-4 h-4 text-blue-600"></i> Cart Items
                    </h2>
                    <span id="cart-count" class="badge bg-blue-50 text-blue-600 border-none font-bold text-xs">0 items</span>
                </div>
                <div id="cart-items" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                    <p id="empty-cart-msg" class="text-xs text-gray-400 text-center py-4">No items added to cart yet.</p>
                </div>
            </div>

            <div class="pt-2 border-t border-gray-100 space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500 font-medium">Total Amount</span>
                    <span id="cart-total" class="text-base font-bold text-gray-900 mono-font">৳0.00</span>
                </div>
                <button id="btn-checkout" class="btn btn-block bg-blue-600 hover:bg-blue-700 text-white border-none shadow-sm font-bold" disabled>
                    Proceed to Payment
                </button>
            </div>
        </section>
    </main>

    <!-- PAYMENT MODAL -->
    <dialog id="modal-payment" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box bg-white text-gray-800 rounded-t-2xl sm:rounded-2xl p-6">
            <h3 class="font-bold text-lg border-b border-gray-100 pb-2 mb-4 flex items-center justify-between">
                Payment Checkout
                <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost text-gray-400">✕</button></form>
            </h3>
            <div class="flex flex-col items-center justify-center space-y-4 py-2">
                <div class="bg-gray-100 p-4 rounded-xl border border-gray-200">
                    <div class="w-40 h-40 bg-white border border-gray-300 rounded-lg flex items-center justify-center relative overflow-hidden">
                        <div class="grid grid-cols-4 gap-2 w-32 h-32 opacity-80">
                            <div class="bg-gray-900"></div><div class="bg-gray-900"></div><div class="bg-white"></div><div class="bg-gray-900"></div>
                            <div class="bg-white"></div><div class="bg-gray-900"></div><div class="bg-gray-900"></div><div class="bg-white"></div>
                            <div class="bg-gray-900"></div><div class="bg-white"></div><div class="bg-gray-900"></div><div class="bg-gray-900"></div>
                            <div class="bg-gray-900"></div><div class="bg-gray-900"></div><div class="bg-white"></div><div class="bg-gray-900"></div>
                        </div>
                    </div>
                </div>
                <div class="text-lg font-bold text-gray-900 mono-font">Total Payable: <span id="payment-amount" class="text-blue-600">৳0.00</span></div>
            </div>
            <div class="modal-action flex-col gap-2">
                <button id="btn-confirm-payment" class="btn bg-blue-600 hover:bg-blue-700 text-white border-none w-full font-bold">Simulate Payment</button>
            </div>
        </div>
    </dialog>

    <!-- ASCII RECEIPT MODAL -->
    <dialog id="modal-receipt" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box bg-white text-gray-900 rounded-t-2xl sm:rounded-2xl p-6">
            <h3 class="font-bold text-sm text-gray-500 uppercase tracking-wider text-center mb-2">Digital Receipt</h3>
            <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl shadow-inner">
                <pre id="ascii-receipt" class="mono-font text-xs leading-relaxed text-gray-800 whitespace-pre overflow-x-auto"></pre>
            </div>
            <div class="modal-action flex flex-col gap-2 mt-4">
                <button id="btn-close-receipt" class="btn bg-gray-900 hover:bg-black text-white border-none w-full font-bold">Close and Reset</button>
            </div>
        </div>
    </dialog>

    <!-- SCRIPT ENGINE INVOCATION -->
    <script type="module">
        let cocoModel = null;
        let barcodeReader = null;
        let cart = [];
        let isCameraActive = false;
        let streamRef = null;

        const priceDatabase = {
            'bottle': 25.00,
            'cup': 15.00,
            'cell phone': 12000.00,
            'book': 150.00
        };

        // DOM Handles
        const btnUpload = document.getElementById('btn-upload');
        const btnCamera = document.getElementById('btn-camera');
        const fileInput = document.getElementById('file-input');
        const imgPreview = document.getElementById('img-preview');
        const webcam = document.getElementById('webcam');
        const canvas = document.getElementById('detection-canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('viewport-placeholder');
        const terminalLogs = document.getElementById('terminal-logs');
        const statusIndicator = document.getElementById('status-indicator');
        const cartItemsContainer = document.getElementById('cart-items');
        const emptyCartMsg = document.getElementById('empty-cart-msg');
        const cartCount = document.getElementById('cart-count');
        const cartTotal = document.getElementById('cart-total');
        const btnCheckout = document.getElementById('btn-checkout');
        const modalPayment = document.getElementById('modal-payment');
        const modalReceipt = document.getElementById('modal-receipt');
        const paymentAmount = document.getElementById('payment-amount');
        const btnConfirmPayment = document.getElementById('btn-confirm-payment');
        const btnCloseReceipt = document.getElementById('btn-close-receipt');
        const asciiReceipt = document.getElementById('ascii-receipt');

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
            initEngines();
        });

        function addLog(msg, color = 'text-gray-300') {
            const entry = document.createElement('div');
            entry.className = color;
            entry.textContent = `> ${msg}`;
            terminalLogs.appendChild(entry);
            terminalLogs.scrollTop = terminalLogs.scrollHeight;
        }

        // Initialize Dynamsoft, Tesseract, & TensorFlow
        async function initEngines() {
            try {
                addLog('Loading COCO-SSD object vision...', 'text-yellow-400');
                cocoModel = await cocoSsd.load();
                addLog('COCO-SSD loaded.', 'text-green-400');

                addLog('Initializing Dynamsoft Barcode Reader...', 'text-yellow-400');
                Dynamsoft.DBR.BarcodeScanner.license = "DLS2eyJoYW5kc2hha2VDb2RlIjoiMjAwMDAxLTE2NDQwNTE5NjI4MzEiLCJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSJ9"; // Public Trial Key
                barcodeReader = await Dynamsoft.DBR.BarcodeReader.createInstance();
                addLog('Dynamsoft Barcode Reader initialized.', 'text-green-400');

                statusIndicator.textContent = 'Engines Ready';
                statusIndicator.className = 'text-[10px] text-green-400';
            } catch (err) {
                statusIndicator.textContent = 'Engine Warning';
                statusIndicator.className = 'text-[10px] text-yellow-400';
                addLog('Engine init warning: ' + err.message, 'text-yellow-400');
            }
        }

        btnUpload.addEventListener('click', () => {
            stopCamera();
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                imgPreview.src = event.target.result;
                imgPreview.classList.remove('hidden');
                webcam.classList.add('hidden');
                placeholder.classList.add('hidden');

                imgPreview.onload = () => {
                    canvas.width = imgPreview.clientWidth;
                    canvas.height = imgPreview.clientHeight;
                    addLog(`Processing uploaded image: ${file.name}`);
                    processImagePipeline(imgPreview);
                };
            };
            reader.readAsDataURL(file);
        });

        async function processImagePipeline(imageElement) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. COCO-SSD Object Detection Pass
            if (cocoModel) {
                const predictions = await cocoModel.detect(imageElement);
                drawBoxes(predictions);
                predictions.forEach(p => {
                    if (p.score >= 0.6) addItemToCart(p.class);
                });
            }

            // 2. Dynamsoft Barcode Detection Pass
            if (barcodeReader) {
                try {
                    addLog('Scanning for barcodes via Dynamsoft...');
                    const results = await barcodeReader.decode(imageElement);
                    for (let result of results) {
                        addLog(`Dynamsoft Barcode Decoded: [${result.barcodeText}]`, 'text-blue-400');
                        addItemToCart(`Barcode (${result.barcodeText})`);
                    }
                } catch (e) {
                    addLog('Dynamsoft barcode scan pass completed.');
                }
            }

            // 3. Simple Tesseract OCR Pass
            try {
                addLog('Running simple Tesseract OCR pass...');
                const ocrResult = await Tesseract.recognize(imageElement, 'eng');
                const cleanText = ocrResult.data.text.trim().replace(/\n/g, ' ');
                if (cleanText.length > 0) {
                    addLog(`Tesseract OCR Text: "${cleanText.substring(0, 30)}..."`, 'text-yellow-300');
                }
            } catch (err) {
                addLog('OCR pass skipped.', 'text-gray-500');
            }
        }

        btnCamera.addEventListener('click', async () => {
            if (isCameraActive) stopCamera();
            else await startCamera();
        });

        async function startCamera() {
            try {
                imgPreview.classList.add('hidden');
                placeholder.classList.add('hidden');
                webcam.classList.remove('hidden');

                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                webcam.srcObject = stream;
                streamRef = stream;
                isCameraActive = true;
                btnCamera.textContent = 'Stop Camera';
                btnCamera.classList.replace('bg-blue-600', 'bg-red-600');

                webcam.onloadedmetadata = () => {
                    canvas.width = webcam.clientWidth;
                    canvas.height = webcam.clientHeight;
                    detectFrame();
                };
            } catch (err) {
                addLog('Camera access unavailable.', 'text-red-400');
            }
        }

        function stopCamera() {
            if (streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                streamRef = null;
            }
            isCameraActive = false;
            webcam.classList.add('hidden');
            btnCamera.textContent = 'Live Camera';
            if (btnCamera.classList.contains('bg-red-600')) {
                btnCamera.classList.replace('bg-red-600', 'bg-blue-600');
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        async function detectFrame() {
            if (!isCameraActive) return;

            if (cocoModel && webcam.readyState === 4) {
                const predictions = await cocoModel.detect(webcam);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBoxes(predictions);
                predictions.forEach(p => {
                    if (p.score >= 0.6) addItemToCart(p.class);
                });
            }
            requestAnimationFrame(detectFrame);
        }

        function drawBoxes(predictions) {
            predictions.forEach(pred => {
                const [x, y, w, h] = pred.bbox;
                ctx.strokeStyle = '#eab308';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);

                ctx.fillStyle = '#eab308';
                const label = `${pred.class} (${Math.round(pred.score * 100)}%)`;
                ctx.font = '12px Roboto, sans-serif';
                const textWidth = ctx.measureText(label).width;
                ctx.fillRect(x, y > 20 ? y - 20 : y, textWidth + 8, 20);

                ctx.fillStyle = '#000000';
                ctx.fillText(label, x + 4, y > 20 ? y - 5 : y + 14);
            });
        }

        function addItemToCart(name) {
            const price = priceDatabase[name.toLowerCase()] || 50.00;
            const existing = cart.find(item => item.name === name);

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.appendChild(emptyCartMsg);
                cartCount.textContent = '0 items';
                cartTotal.textContent = '৳0.00';
                btnCheckout.disabled = true;
                return;
            }

            let total = 0, count = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                count += item.qty;

                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100 text-xs';
                row.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800 capitalize">${item.name}</p>
                        <p class="text-gray-400">৳${item.price.toFixed(2)} x ${item.qty}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-gray-900 mono-font">৳${itemTotal.toFixed(2)}</span>
                        <button class="btn btn-xs btn-ghost text-red-500 hover:bg-red-50" onclick="removeItem(${index})">✕</button>
                    </div>
                `;
                cartItemsContainer.appendChild(row);
            });

            cartCount.textContent = `${count} item${count > 1 ? 's' : ''}`;
            cartTotal.textContent = `৳${total.toFixed(2)}`;
            btnCheckout.disabled = false;
        }

        window.removeItem = (index) => {
            cart.splice(index, 1);
            renderCart();
        };

        btnCheckout.addEventListener('click', () => {
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            paymentAmount.textContent = `৳${total.toFixed(2)}`;
            modalPayment.showModal();
        });

        btnConfirmPayment.addEventListener('click', () => {
            modalPayment.close();
            generateAsciiReceipt();
            modalReceipt.showModal();
        });

        function generateAsciiReceipt() {
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            let receipt = `=========================================\n`;
            receipt += `             AAC.BD CHECKOUT             \n`;
            receipt += `=========================================\n`;
            receipt += `Date: ${new Date().toLocaleString()}\n`;
            receipt += `-----------------------------------------\n`;
            receipt += `Item            Qty   Price     Amount   \n`;
            receipt += `-----------------------------------------\n`;

            cart.forEach(item => {
                const name = item.name.padEnd(14, ' ').substring(0, 14);
                const qty = item.qty.toString().padStart(3, ' ');
                const price = item.price.toFixed(0).padStart(7, ' ');
                const amt = (item.price * item.qty).toFixed(2).padStart(8, ' ');
                receipt += `${name} ${qty} ৳${price} ৳${amt}\n`;
            });

            receipt += `-----------------------------------------\n`;
            receipt += `TOTAL:                   ৳${total.toFixed(2).padStart(9, ' ')}\n`;
            receipt += `=========================================\n`;
            receipt += `        THANK YOU FOR SHOPPING!          \n`;
            receipt += `=========================================\n`;

            asciiReceipt.textContent = receipt;
        }

        btnCloseReceipt.addEventListener('click', () => {
            modalReceipt.close();
            cart = [];
            renderCart();
            addLog('Checkout completed. Cart reset.', 'text-green-400');
        });
    </script>
</body>
</html>
