<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-POS Hybrid Live Barcode & Packaging OCR Reader</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #06b6d4;
            --barcode-color: #10b981;
            --ocr-color: #f59e0b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 12px;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #overlayCanvas {
            z-index: 10;
            pointer-events: none;
        }

        /* Target Viewfinder Reticle for OCR focus */
        .scan-reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 55%;
            border: 2px dashed rgba(6, 182, 212, 0.6);
            border-radius: 10px;
            z-index: 15;
            pointer-events: none;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.35);
            transition: border-color 0.3s ease;
        }

        .scan-reticle::before {
            content: 'ALIGN LABEL / BARCODE HERE';
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
        }

        .dot.active {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .controls {
            width: 100%;
            max-width: 600px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        button, label.btn-fallback {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-primary:active {
            background-color: #1d4ed8;
        }

        label.btn-fallback {
            background-color: #059669;
            color: #ffffff;
        }

        label.btn-fallback:active {
            background-color: #047857;
        }

        #fileFallback {
            display: none;
        }

        .console-panel {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 12px;
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .console-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .log-box {
            font-family: "Courier New", Courier, monospace;
            font-size: 0.8rem;
            color: #38bdf8;
            height: 110px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            line-height: 1.3;
            word-break: break-all;
        }

        .log-entry.barcode { color: #34d399; }
        .log-entry.ocr { color: #fbbf24; }
        .log-entry.error { color: #f87171; }
    </style>

    <!-- Quagga2 Barcode Fallback Library -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <!-- Tesseract.js OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<header>
    <h1>AI-POS Vision Engine</h1>
    <p>Targeted Barcode & High-Contrast Packaging OCR Pipeline</p>
</header>

<div class="viewport-wrapper">
    <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Offline</span>
    </div>
    <div class="scan-reticle"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
</div>

<div class="controls">
    <button id="btnStart" class="btn-primary">
        <span>📷 Start Live Cam</span>
    </button>
    <label for="fileFallback" class="btn-fallback">
        <span>📁 High-Res Capture</span>
    </label>
    <input type="file" id="fileFallback" accept="image/*" capture="environment">
</div>

<div class="console-panel">
    <div class="console-header">
        <span>System Diagnostics Log</span>
        <span id="fpsCounter">0 FPS</span>
    </div>
    <div class="log-box" id="logBox">
        <div class="log-entry">> Initializing vision engine...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const ctx = overlayCanvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const fileFallback = document.getElementById('fileFallback');
    
    let isOcrProcessing = false;
    let ocrWorker = null;
    let barcodeDetector = null;
    let activeStream = null;
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let lastOcrRunTime = 0;
    const OCR_INTERVAL_MS = 500; // Fast 2Hz OCR pass rate

    // Persistent Buffers for performance (Zero GC stutter)
    const offscreenCanvas = document.createElement('canvas');
    const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
    
    const ocrProcCanvas = document.createElement('canvas');
    const ocrProcCtx = ocrProcCanvas.getContext('2d', { willReadFrequently: true });

    // Persistent Bounding Box Tracking System
    const detectedBoxTracker = new Map();
    const activeBarcodeTracker = new Map();
    const DISPLAY_HOLD_TIME_MS = 3500; // Hold bounding boxes in place

    function log(msg, type = 'info') {
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString().split(' ')[0];
        entry.textContent = `[${time}] ${msg}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function initBarcodeDetector() {
        if ('BarcodeDetector' in window) {
            try {
                barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'qr_code'] });
                log("Native Browser BarcodeDetector Engine Active.");
            } catch (e) {
                log("Native BarcodeDetector failed, falling back to Quagga2.", "error");
            }
        } else {
            log("Native BarcodeDetector unavailable. Standard Quagga2 engine ready.");
        }
    }

    async function initOCR() {
        try {
            log("Loading Tesseract WASM OCR Core...");
            ocrWorker = await Tesseract.createWorker('eng');
            
            // Set Page Segmentation Mode to SPARSE_TEXT ('11') for product labels
            await ocrWorker.setParameters({
                tessedit_pageseg_mode: '11',
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789. %$'
            });
            log("OCR Engine Configured (Sparse Label Mode).");
        } catch (err) {
            log(`OCR Worker Error: ${err.message}`, 'error');
        }
    }

    initBarcodeDetector();
    initOCR();

    async function startCamera() {
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            log("SECURITY ERROR: WebRTC requires HTTPS or localhost!", "error");
            alert("WebRTC camera access requires an HTTPS domain or local server.");
            return;
        }

        try {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            log("Requesting camera permission...");
            activeStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = activeStream;
            
            video.onloadedmetadata = () => {
                video.play();
                syncCanvasDimensions(video.videoWidth, video.videoHeight);
                
                statusDot.classList.add('active');
                statusText.textContent = "Live Feed";
                log("Live camera feed streaming successfully.");
                
                if (!barcodeDetector) {
                    startQuaggaLive();
                }
                
                requestAnimationFrame(liveProcessingLoop);
            };
        } catch (err) {
            log(`WebRTC Error [${err.name}]: ${err.message}`, "error");
            statusDot.classList.remove('active');
            statusText.textContent = "Permission Error";
        }
    }

    function syncCanvasDimensions(w, h) {
        overlayCanvas.width = w;
        overlayCanvas.height = h;
        offscreenCanvas.width = w;
        offscreenCanvas.height = h;
        
        // Downscaled ROI Canvas for fast parallel OCR
        const scale = Math.min(1, 640 / w);
        ocrProcCanvas.width = Math.round(w * scale);
        ocrProcCanvas.height = Math.round(h * scale);
    }

    async function liveProcessingLoop() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            frameCount++;
            const now = performance.now();
            if (now - lastFrameTime >= 1000) {
                document.getElementById('fpsCounter').textContent = `${frameCount} FPS`;
                frameCount = 0;
                lastFrameTime = now;
            }

            const currentTime = Date.now();

            // 1. Fast Barcode Pass
            if (barcodeDetector) {
                try {
                    offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
                    const barcodes = await barcodeDetector.detect(offscreenCanvas);
                    barcodes.forEach(bc => {
                        const box = bc.boundingBox;
                        activeBarcodeTracker.set(bc.rawValue, {
                            x: box.x, y: box.y, w: box.width, h: box.height,
                            text: `BAR: ${bc.rawValue}`,
                            lastSeen: currentTime
                        });
                        log(`Barcode Read: ${bc.rawValue}`, "barcode");
                    });
                } catch (e) {}
            }

            // 2. Focused ROI Packaging OCR Pass
            if (ocrWorker && !isOcrProcessing && (currentTime - lastOcrRunTime > OCR_INTERVAL_MS)) {
                isOcrProcessing = true;
                lastOcrRunTime = currentTime;

                // Define ROI (Focus area inside center reticle: 70% width, 55% height)
                const fullW = overlayCanvas.width;
                const fullH = overlayCanvas.height;
                const roiW = fullW * 0.70;
                const roiH = fullH * 0.55;
                const roiX = (fullW - roiW) / 2;
                const roiY = (fullH - roiH) / 2;

                // Scale ROI coordinates onto downsampled processing canvas
                const procScaleX = ocrProcCanvas.width / fullW;
                const procScaleY = ocrProcCanvas.height / fullH;

                preprocessROIForOCR(video, roiX, roiY, roiW, roiH, ocrProcCanvas, ocrProcCtx);

                ocrWorker.recognize(ocrProcCanvas).then(({ data }) => {
                    const procRoiW = roiW * procScaleX;
                    const procRoiH = roiH * procScaleY;

                    data.words.forEach(word => {
                        // Filter out single character clutter or low confidence matches
                        const cleanText = word.text.replace(/[^a-zA-Z0-9$%.-]/g, '').trim();
                        if (word.confidence > 55 && cleanText.length >= 3) {
                            const b = word.bbox;
                            
                            // Map local ROI coordinates back to main canvas display
                            const fullX = roiX + (b.x0 / procScaleX);
                            const fullY = roiY + (b.y0 / procScaleY);
                            const fullW = (b.x1 - b.x0) / procScaleX;
                            const fullH = (b.y1 - b.y0) / procScaleY;

                            const textKey = cleanText.toUpperCase();
                            detectedBoxTracker.set(textKey, {
                                x: fullX,
                                y: fullY,
                                w: fullW,
                                h: fullH,
                                text: `${cleanText} (${Math.round(word.confidence)}%)`,
                                lastSeen: Date.now()
                            });
                            log(`Label Read: "${cleanText}" [${Math.round(word.confidence)}%]`, "ocr");
                        }
                    });
                    isOcrProcessing = false;
                }).catch(() => { isOcrProcessing = false; });
            }
        }

        renderOverlayCanvas();
        
        if (activeStream && activeStream.active) {
            requestAnimationFrame(liveProcessingLoop);
        }
    }

    function preprocessROIForOCR(source, rx, ry, rw, rh, targetCanvas, targetCtx) {
        targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
        
        // Draw only the cropped ROI region onto the processing canvas
        targetCtx.drawImage(
            source,
            rx, ry, rw, rh,
            0, 0, targetCanvas.width, targetCanvas.height
        );
        
        const imgData = targetCtx.getImageData(0, 0, targetCanvas.width, targetCanvas.height);
        const data = imgData.data;

        // Pass 1: Measure average luminance to handle light-on-dark vs dark-on-light packaging
        let totalBrightness = 0;
        const pixelCount = data.length / 4;
        
        for (let i = 0; i < data.length; i += 4) {
            totalBrightness += (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
        }
        const avgLuminance = totalBrightness / pixelCount;
        const invertThreshold = avgLuminance < 100; // True if package background is dark

        // Pass 2: High-contrast binarization with dynamic inversion
        for (let i = 0; i < data.length; i += 4) {
            let luminance = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            
            if (invertThreshold) {
                // Invert dark background so text becomes black on white for Tesseract
                luminance = 255 - luminance;
            }

            const binary = luminance > 125 ? 255 : 0;
            data[i] = binary;
            data[i + 1] = binary;
            data[i + 2] = binary;
        }

        targetCtx.putImageData(imgData, 0, 0);
    }

    function renderOverlayCanvas() {
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        const now = Date.now();

        activeBarcodeTracker.forEach((item, key) => {
            const elapsed = now - item.lastSeen;
            if (elapsed < DISPLAY_HOLD_TIME_MS) {
                const opacity = elapsed > (DISPLAY_HOLD_TIME_MS - 800) 
                    ? (DISPLAY_HOLD_TIME_MS - elapsed) / 800 
                    : 1.0;
                drawRectBox(item.x, item.y, item.w, item.h, item.text, "#10b981", opacity);
            } else {
                activeBarcodeTracker.delete(key);
            }
        });

        detectedBoxTracker.forEach((item, key) => {
            const elapsed = now - item.lastSeen;
            if (elapsed < DISPLAY_HOLD_TIME_MS) {
                const opacity = elapsed > (DISPLAY_HOLD_TIME_MS - 800) 
                    ? (DISPLAY_HOLD_TIME_MS - elapsed) / 800 
                    : 1.0;
                drawRectBox(item.x, item.y, item.w, item.h, item.text, "#f59e0b", opacity);
            } else {
                detectedBoxTracker.delete(key);
            }
        });
    }

    fileFallback.addEventListener('change', async (e) => {
        if (!e.target.files || !e.target.files[0]) return;
        
        log("Processing High-Res Captured Photo...");
        statusDot.classList.add('active');
        statusText.textContent = "Processing Photo";

        const file = e.target.files[0];
        const blobUrl = URL.createObjectURL(file);
        const img = new Image();
        img.src = blobUrl;

        img.onload = async () => {
            syncCanvasDimensions(img.width, img.height);
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            ctx.drawImage(img, 0, 0);

            let barcodeFound = false;
            if (barcodeDetector) {
                try {
                    const barcodes = await barcodeDetector.detect(img);
                    barcodes.forEach(bc => {
                        barcodeFound = true;
                        const box = bc.boundingBox;
                        drawRectBox(box.x, box.y, box.width, box.height, `BARCODE: ${bc.rawValue}`, "#10b981", 1.0);
                        log(`STATIC BARCODE FOUND: ${bc.rawValue}`, "barcode");
                    });
                } catch (err) {}
            }

            if (!barcodeFound) {
                Quagga.decodeSingle({
                    src: blobUrl,
                    numOfWorkers: 0,
                    inputStream: { size: img.width },
                    decoder: { readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader"] }
                }, (result) => {
                    if (result && result.codeResult) {
                        log(`QUAGGA BARCODE FOUND: ${result.codeResult.code}`, "barcode");
                    }
                });
            }

            if (ocrWorker) {
                log("Running Targeted Packaging OCR...");
                preprocessROIForOCR(img, 0, 0, img.width, img.height, ocrProcCanvas, ocrProcCtx);
                
                const { data } = await ocrWorker.recognize(ocrProcCanvas);
                let detectedCount = 0;

                data.words.forEach(word => {
                    const cleanText = word.text.replace(/[^a-zA-Z0-9$%.-]/g, '').trim();
                    if (word.confidence > 50 && cleanText.length >= 3) {
                        detectedCount++;
                        const b = word.bbox;
                        drawRectBox(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0, `${cleanText} (${Math.round(word.confidence)}%)`, "#f59e0b", 1.0);
                    }
                });
                log(`OCR Complete. Identified ${detectedCount} valid text regions.`, "ocr");
            }

            URL.revokeObjectURL(blobUrl);
            statusText.textContent = "Capture Complete";
        };
    });

    function drawRectBox(x, y, w, h, text, color, opacity = 1.0) {
        ctx.save();
        ctx.globalAlpha = opacity;

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        ctx.font = "bold 15px -apple-system, sans-serif";
        const textWidth = ctx.measureText(text).width;
        const tagHeight = 22;
        const tagY = y - tagHeight > 0 ? y - tagHeight : y;

        ctx.fillStyle = color;
        ctx.fillRect(x, tagY, textWidth + 10, tagHeight);

        ctx.fillStyle = "#000000";
        ctx.fillText(text, x + 5, tagY + 16);

        ctx.restore();
    }

    document.getElementById('btnStart').addEventListener('click', startCamera);
</script>
</body>
</html>
